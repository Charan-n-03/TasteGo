{% extends "base.html" %}
{% block title %}Add Restaurant{% endblock %}
{% block content %}
<a href="{{ url_for('admin.restaurants') }}" class="btn btn-ghost mb-3"><i class="fa-solid fa-arrow-left"></i> Back</a>
<div class="form-card" style="max-width:500px">
    <h2>Add Restaurant</h2>
    <form action="{{ url_for('admin.add_restaurant') }}" method="POST">
        <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
        <div class="form-group"><label>Description</label><textarea name="description" rows="3" required></textarea></div>
        <div class="form-group"><label>Image URL</label><input type="url" name="image_url" placeholder="https://..."></div>
        <div class="form-group"><label>Cuisine Type</label><input type="text" name="cuisine_type" placeholder="North Indian, Chinese"></div>
        <div class="form-group"><label>Assign Owner</label><select name="owner_id" required>{% for s in staff_users %}<option value="{{ s.id }}">{{ s.username }} ({{ s.email }})</option>{% endfor %}</select></div>
        <p class="text-muted" style="font-size:12px;margin-bottom:12px">*Admin-added restaurants are auto-approved</p>
        <button type="submit" class="btn" style="width:100%">Create Restaurant</button>
    </form>
</div>
{% endblock %}
