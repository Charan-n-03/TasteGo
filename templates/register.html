{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="form-card">
    <div style="text-align:center;margin-bottom:8px"><i class="fa-solid fa-fire-flame-curved" style="font-size:36px;color:var(--primary)"></i></div>
    <h2>Create Account</h2>
    <p class="text-muted text-center mb-3" style="font-size:14px">Join TasteGo and start ordering</p>
    <form method="POST" action="{{url_for('auth.register')}}">
        <div class="form-group">
            <label><i class="fa-solid fa-user"></i> Username</label>
            <input type="text" name="username" placeholder="Choose a username" required>
        </div>
        <div class="form-group">
            <label><i class="fa-solid fa-envelope"></i> Email</label>
            <input type="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label><i class="fa-solid fa-phone"></i> Phone (optional)</label>
            <input type="tel" name="phone" placeholder="+91 98765 43210">
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" name="password" placeholder="Min 6 characters" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Confirm</label>
                <input type="password" name="c_password" placeholder="Re-enter password" required>
            </div>
        </div>
        <div class="form-group">
            <label><i class="fa-solid fa-user-tag"></i> I want to</label>
            <select name="role" required>
                <option value="customer">🍽️ Order Food (Customer)</option>
                <option value="staff">🏪 List My Restaurant (Staff)</option>
                <option value="partner">🛵 Deliver Food (Partner)</option>
            </select>
        </div>
        <button type="submit" class="btn" style="width:100%;margin-top:8px"><i class="fa-solid fa-user-plus"></i> Create Account</button>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--text-muted)">
        Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
    </p>
</div>
{% endblock %}
