{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'Add' }} Menu Item{% endblock %}
{% block content %}
<a href="{{ url_for('restaurant.menu', restaurant_id=restaurant.id) }}" class="btn btn-ghost mb-3"><i class="fa-solid fa-arrow-left"></i> Back to Menu</a>
<div class="form-card" style="max-width:600px">
    <h2>{{ 'Edit' if item else 'Add' }} Menu Item</h2>
    <form action="{{ url_for('restaurant.menu_item_edit', item_id=item.id) if item else url_for('restaurant.menu_item_add', restaurant_id=restaurant.id) }}" method="POST">
        <div class="form-group"><label>Item Name</label><input type="text" name="name" value="{{ item.name if item else '' }}" required></div>
        <div class="form-group"><label>Description</label><textarea name="description" rows="2">{{ item.description if item else '' }}</textarea></div>
        <div class="grid-2">
            <div class="form-group"><label>Price (₹)</label><input type="number" step="0.01" name="price" value="{{ item.price if item else '' }}" required></div>
            <div class="form-group"><label>Category</label>
                <select name="category">
                    {% for c in ['Starters','Main Course','Breads','Rice & Biryani','Desserts','Beverages','Snacks'] %}
                    <option value="{{ c }}" {{ 'selected' if item and item.category == c }}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group"><label>Image URL</label><input type="url" name="image_url" value="{{ item.image_url if item else '' }}" placeholder="https://images.unsplash.com/..."></div>
        <div class="grid-2">
            <div class="form-group"><label>Type</label><select name="is_veg"><option value="1" {{ 'selected' if not item or item.is_veg }}>🟢 Vegetarian</option><option value="0" {{ 'selected' if item and not item.is_veg }}>🔴 Non-Vegetarian</option></select></div>
            <div class="form-group"><label>Bestseller?</label><select name="is_bestseller"><option value="0" {{ 'selected' if not item or not item.is_bestseller }}>No</option><option value="1" {{ 'selected' if item and item.is_bestseller }}>⭐ Yes</option></select></div>
        </div>
        <button type="submit" class="btn" style="width:100%">{{ 'Update' if item else 'Create' }} Item</button>
    </form>
</div>
{% endblock %}
